<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Droid Switch app icon">
  <defs>
    <linearGradient id="bg" x1="200" y1="120" x2="824" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f4a6b"/>
      <stop offset="0.5" stop-color="#0f1e2e"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="380" cy="280" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5be0d4" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#1ba7c5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#061017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="700" cy="780" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="280" y1="380" x2="780" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8fff7"/>
      <stop offset="1" stop-color="#3cd9c7"/>
    </linearGradient>
    <linearGradient id="amber" x1="780" y1="644" x2="280" y2="644" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd070"/>
      <stop offset="1" stop-color="#ff9a32"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#28ecdd" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#ffb647" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#topGlow)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bottomGlow)"/>
  </g>

  <rect x="106" y="106" width="812" height="812" rx="180" ry="180"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <g filter="url(#cyanGlow)">
    <path d="M 280 380 L 660 380"
          fill="none" stroke="url(#cyan)" stroke-width="64"
          stroke-linecap="round"/>
    <path d="M 620 296 L 760 380 L 620 464"
          fill="none" stroke="url(#cyan)" stroke-width="64"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#amberGlow)">
    <path d="M 744 644 L 364 644"
          fill="none" stroke="url(#amber)" stroke-width="64"
          stroke-linecap="round"/>
    <path d="M 404 560 L 264 644 L 404 728"
          fill="none" stroke="url(#amber)" stroke-width="64"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
